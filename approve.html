<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Approve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://res.cdn.office.net/teams-js/2.0.0/js/MicrosoftTeams.min.js"></script>
  <style>
    body {
      background: #fff3cd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      margin: 0;
      font-size: 14px;
      color: #222;
    }

    .banner {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtle {
      color: #555;
      margin-bottom: 12px;
    }

    #log {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 12px;
      min-height: 160px;
    }
  </style>
</head>
<body>
  <div class="banner">MOBILE TEST BUILD</div>
  <div class="subtle">This build is hardcoded to stay open for debugging.</div>
  <pre id="log">Starting...</pre>

  <script>
    (async () => {
      const HOLD_OPEN = true;
      const qs = new URLSearchParams(location.search);
      const logEl = document.getElementById('log');

      function log(msg) {
        const line = `[${new Date().toISOString()}] ${msg}`;
        console.log(line);
        logEl.textContent += '\n' + line;
      }

      const payload = {
        objectId: '',
        itemId: qs.get('itemId'),
        listId: qs.get('listId'),
        siteId: qs.get('siteId'),
        siteAddress: qs.get('siteAddress')
      };

      const triggerUrl = qs.get('triggerUrl') || '';

      log('Page loaded');
      log('HOLD_OPEN=' + HOLD_OPEN);
      log('itemId present=' + (!!payload.itemId));
      log('listId present=' + (!!payload.listId));
      log('siteId present=' + (!!payload.siteId));
      log('siteAddress present=' + (!!payload.siteAddress));
      log('triggerUrl present=' + (!!triggerUrl));

      try {
        const u = new URL(triggerUrl);
        log('trigger origin=' + u.origin);
        log('trigger path=' + u.pathname);
        log('has api-version=' + u.searchParams.has('api-version'));
        log('has sp=' + u.searchParams.has('sp'));
        log('has sv=' + u.searchParams.has('sv'));
        log('has sig=' + u.searchParams.has('sig'));

        const sig = u.searchParams.get('sig') || '';
        log('sig length=' + sig.length);
        log('sig tail=' + (sig ? sig.slice(-6) : '(missing)'));
      } catch (e) {
        log('trigger URL parse failed: ' + (e?.message || e));
      }

      try {
        log('Before initialize');
        await microsoftTeams.app.initialize();
        log('After initialize');

        log('Before getContext');
        const ctx = await microsoftTeams.app.getContext();
        log('After getContext');

        payload.objectId = ctx?.user?.id || '';
        log('objectId present=' + (!!payload.objectId));
        log('frameContext=' + (ctx?.page?.frameContext || '(unknown)'));
        log('clientType=' + (ctx?.app?.host?.clientType || '(unknown)'));

        log('Before fetch');
        const response = await fetch(triggerUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        log(`After fetch status=${response.status} ok=${response.ok}`);

        let responseText = '';
        try {
          responseText = await response.text();
          log('Response body preview=' + (responseText ? responseText.slice(0, 1000) : '(empty)'));
        } catch (readErr) {
          log('Could not read response body: ' + (readErr?.message || readErr));
        }

        if (!response.ok) {
          log('Not closing because response was not OK');
          return;
        }

        if (HOLD_OPEN) {
          log('HOLD_OPEN active, not closing after successful response');
          return;
        }

        log('Closing dialog');
        (microsoftTeams.dialog?.submit || microsoftTeams.tasks.submitTask)();
      } catch (e) {
        log('ERROR: ' + (e?.message || e));

        try {
          log('ERROR STACK: ' + (e?.stack || '(no stack)'));
        } catch (_) {}

        return;
      }
    })();
  </script>
</body>
</html>
