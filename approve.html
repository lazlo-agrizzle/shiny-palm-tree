<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approve</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://res.cdn.office.net/teams-js/2.0.0/js/MicrosoftTeams.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 12px; font-size: 14px; }
  #log { white-space: pre-wrap; word-break: break-word; }
  .ok { color: #0a7a0a; }
  .err { color: #b00020; }
</style>
</head>

<body style="background:#fff3cd; font-family:sans-serif; padding:16px;">
  <div><strong>MOBILE TEST BUILD 2026-04-24 aaaaaaaaaaaaaaaaaa</strong></div>
  <pre id="log" style="white-space:pre-wrap; margin-top:12px;"></pre>

<script>
(async () => {
  const qs = new URLSearchParams(location.search);
  const HOLD_OPEN = qs.get('holdOpen') === '1';
  const logEl = document.getElementById('log');

  function log(msg) {
    console.log(msg);
    logEl.textContent += msg + '\n';
  }

  log('Page loaded');
  log('holdOpen=' + HOLD_OPEN);

  const payload = {
    objectId: '',
    itemId: qs.get('itemId'),
    listId: qs.get('listId'),
    siteId: qs.get('siteId'),
    siteAddress: qs.get('siteAddress')
  };
  const triggerUrl = decodeURIComponent(qs.get('triggerUrl') || '');

  try {
    log('Before initialize');
    await microsoftTeams.app.initialize();
    log('After initialize');

    const ctx = await microsoftTeams.app.getContext();
    log('After getContext');

    payload.objectId = ctx.user?.id || '';
    log('objectId present=' + (!!payload.objectId));

    if (HOLD_OPEN) {
      log('HOLD OPEN active - stopping before fetch/close');
      return;
    }

    log('Before fetch');
    const response = await fetch(triggerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    log(`After fetch status=${response.status} ok=${response.ok}`);
  } catch (e) {
    log('ERROR: ' + (e?.message || e));
    return;
  }

  if (HOLD_OPEN) {
    log('HOLD OPEN active - not closing dialog');
    return;
  }

  log('Closing dialog');
  (microsoftTeams.dialog?.submit || microsoftTeams.tasks.submitTask)();
})();
</script>
</body>
