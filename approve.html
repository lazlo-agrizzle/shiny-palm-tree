<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Approve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://res.cdn.office.net/teams-js/2.0.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
<script>
(async () => {
  const qs = new URLSearchParams(location.search);

  const payload = {
    objectId: '',
    itemId: qs.get('itemId'),
    listId: qs.get('listId'),
    siteId: qs.get('siteId'),
    siteAddress: qs.get('siteAddress')
  };

  let triggerUrl = qs.get('triggerUrl') || '';

  try {
    const u = new URL(triggerUrl);

    for (const key of ['api-version', 'sp', 'sv', 'sig']) {
      if (!u.searchParams.has(key) && qs.has(key)) {
        u.searchParams.set(key, qs.get(key) || '');
      }
    }

    triggerUrl = u.toString();
  } catch (e) {
    console.error('Failed to normalize triggerUrl', e);
  }

  try {
    await microsoftTeams.app.initialize();
    const ctx = await microsoftTeams.app.getContext();
    payload.objectId = ctx.user?.id || '';

    const response = await fetch(triggerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const body = await response.text().catch(() => '');
      console.error('POST failed', response.status, body);
      return;
    }
  } catch (e) {
    console.error(e);
    return;
  }

  try {
    (microsoftTeams.dialog?.submit || microsoftTeams.tasks.submitTask)();
  } catch (e) {
    console.error('Dialog close failed', e);
  }
})();
</script>
</body>
</html>
